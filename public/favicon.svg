<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pageGradLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0"/>
      <stop offset="100%" style="stop-color:#F5E6D3"/>
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0"/>
      <stop offset="100%" style="stop-color:#F5E6D3"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D"/>
      <stop offset="100%" style="stop-color:#4ECDC4"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
  </defs>
  
  <!-- Book covers (back) -->
  <path d="M2 18 Q2 10, 10 10 L45 14 Q50 15, 50 22 L50 82 Q50 86, 45 85 L10 81 Q2 80, 2 72 Z" fill="url(#coverGrad)"/>
  <path d="M98 18 Q98 10, 90 10 L55 14 Q50 15, 50 22 L50 82 Q50 86, 55 85 L90 81 Q98 80, 98 72 Z" fill="url(#coverGrad)"/>
  
  <!-- Book pages (left) -->
  <path d="M8 22 Q8 17, 14 17 L46 20 Q50 21, 50 26 L50 78 Q50 81, 46 80 L14 77 Q8 76, 8 71 Z" fill="url(#pageGradLeft)"/>
  
  <!-- Book pages (right) -->
  <path d="M92 22 Q92 17, 86 17 L54 20 Q50 21, 50 26 L50 78 Q50 81, 54 80 L86 77 Q92 76, 92 71 Z" fill="url(#pageGradRight)"/>
  
  <!-- Page lines (left) -->
  <line x1="16" y1="26" x2="42" y2="29" stroke="#D4C4B4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="37" x2="42" y2="40" stroke="#D4C4B4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="48" x2="42" y2="51" stroke="#D4C4B4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="59" x2="42" y2="62" stroke="#D4C4B4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="70" x2="42" y2="73" stroke="#D4C4B4" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Page lines (right) -->
  <line x1="58" y1="29" x2="84" y2="26" stroke="#D4C4B4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="40" x2="84" y2="37" stroke="#D4C4B4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="51" x2="84" y2="48" stroke="#D4C4B4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="62" x2="84" y2="59" stroke="#D4C4B4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="73" x2="84" y2="70" stroke="#D4C4B4" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Book spine -->
  <path d="M47 19 Q50 18, 53 19 L53 81 Q50 82, 47 81 Z" fill="#D4A574"/>
  
  <!-- Sparkle top right (large, overlapping corner) -->
  <!-- Center at ~80,18, tips extend 26 units out -->
  <path d="M80 -8
           Q80 10, 106 18
           Q80 26, 80 44
           Q80 26, 54 18
           Q80 10, 80 -8
           Z" fill="url(#sparkleGrad)"/>
  <circle cx="80" cy="18" r="6" fill="#FFF8DC"/>
  
  <!-- Sparkle bottom left (medium, overlapping corner) -->
  <!-- Center at ~8,82, tips extend 20 units out -->
  <path d="M8 62
           Q8 76, 28 82
           Q8 88, 8 102
           Q8 88, -12 82
           Q8 76, 8 62
           Z" fill="url(#sparkleGrad)"/>
  <circle cx="8" cy="82" r="4.5" fill="#FFF8DC"/>
</svg>
